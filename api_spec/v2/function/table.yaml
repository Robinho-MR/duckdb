    return_type: ERROR

  table_function_stats_get_column_index:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Returns which declared column the statistics describe.

      The result indexes the columns declared with `[[table_function_bind_add_result_column]]`, in declaration order.
      It is never the index of a virtual column or of a field extracted from a column; the callback is not asked
      about those.
    parameters:
      info:
        type: table_function_stats_info
        description: The stats info handle.
      column_index:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the index of the declared column.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_stats_get_result_stats:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Retrieves the statistics of the column, for the callback to narrow.

      The statistics start out unknown, with every kind of value possible, and are of the column's type as the bind
      callback declared it. The callback narrows them with `[[stats_set_value]]`, from a STRUCT value in the shape
      `[[stats_get_value]]` returns - e.g. `{'min': 20, 'max': 30, 'has_null': false}` for an INTEGER column, or the
      statistics of the fields of a STRUCT column under `child_stats` - and with `[[stats_set_can_have_null]]` /
      `[[stats_set_can_have_valid]]`. Statistics built with `[[stats_create]]`, e.g. combined from the files of a scan
      with `[[stats_merge]]`, are copied in with `[[stats_assign]]`. They describe every value the scan produces for
      the column. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: table_function_stats_info
        description: The stats info handle.
      stats:
        type: stats
        indirection: 1
        kind: OUT
        description: Receives the borrowed, writable statistics of the column.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR


  #---------------------------------------------------------------------------------------------------------------------
  # Register
  #---------------------------------------------------------------------------------------------------------------------
  connection_register_table_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Registers the table function, making it available for use in SQL queries.

      The function is registered on the connection's database, visible to every connection, in the connection's
      transaction: inside an explicit transaction, it is invisible to other connections until the transaction commits,
      and a rollback undoes it. Registration requires a name, a bind callback and either a data source or an operator (see `[[table_function_set_operator]]`), and rejects a
      signature that declares a return type, since a table function declares the columns it returns from its bind
      callback. The table function must have been created through a factory of the same database. The caller still owns
      the handle after registration and must destroy it with `[[table_function_destroy]]`, which does not affect the
      registered function.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to register on.
      function:
        type: table_function
        description: The table function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  extension_register_table_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Registers the table function, making it available for use in SQL queries.

      The function is registered on the loading extension's database and attributed to the extension. Use this from the
      extension's load callback. Registration requires a name, a bind callback and either a data source or an operator (see `[[table_function_set_operator]]`), and rejects a
      signature that declares a return type, since a table function declares the columns it returns from its bind
      callback. The table function must have been created through a factory of the same database. The caller still owns
      the handle after registration and must destroy it with `[[table_function_destroy]]`, which does not affect the
      registered function.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: The loading extension.
      function:
        type: table_function
        description: The table function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Destroy
  #---------------------------------------------------------------------------------------------------------------------
  table_function_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Destroys the table function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to
      prevent double-destruction. Destroying the handle after registration does not affect the registered
      function.
    parameters:
      function:
        type: table_function
        description: The function to destroy.
        indirection: 1
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Get Bind Info Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  table_function_set_get_bind_info_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-06" ]
    description: |
      Sets the optional "get bind info" callback of the table function.

      The engine invokes the callback with the bind data of a bound call when it needs to know more about the call than
      its columns. E.g. a multi-file function registered with `[[connection_register_multi_file_function]]` or
      `[[extension_register_multi_file_function]]` asks the function it wraps for every file it binds: it maps the
      columns of the files onto the columns of its scan by the identifiers the callback reports, and exposes the options
      it reports as the metadata of the reader of the file. The callback may be invoked more than once for the same bind
      data, so it should only report what the bind already determined.
    parameters:
      function:
        type: table_function
        description: The function to set the callback of.
      callback:
        type: table_function_get_bind_info_callback
        description: The "get bind info" callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_get_bind_info_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-06" ]
    description: Retrieves the user data set via `[[table_function_set_user_data]]`.
    parameters:
      info:
        type: table_function_get_bind_info_info
        description: The get bind info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_get_bind_info_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-06" ]
    description: Retrieves the bind data the function's bind callback set for the bound call being described.
    parameters:
      info:
        type: table_function_get_bind_info_info
        description: The get bind info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_get_bind_info_set_column_identifier:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-06" ]
    description: |
      Attaches an identifier to a result column of the bound call, or to a field nested inside one.

      A multi-file reader can then map the columns of every file onto the columns of its scan by identifier rather
      than by name - e.g. by the field ids of a file format that carries them, so that renamed columns and fields are
      still found. An identifier is an INTEGER field id or a VARCHAR name.

      The nested field is addressed by a path of child indexes, starting at the result column at `column_index`: a
      STRUCT field by its index, the elements of a LIST or ARRAY by `0`, the keys of a MAP by `0` and its values by
      `1`, and a UNION member by its index. An empty path addresses the result column itself. Setting an identifier
      again for the same column or field replaces it. Fails with `ERROR_INPUT_INVALID` when the column index is out
      of range, or the path does not address a nested field of the column's type.
    parameters:
      info:
        type: table_function_get_bind_info_info
        description: The get bind info handle.
      column_index:
        type: idx
        description: The index of the result column, in the order the bind callback declared the columns.
      child_path:
        type: idx
        indirection: 1
        const: true
        description: The path of child indexes addressing the nested field, or null for the column itself.
      child_path_length:
        type: idx
        description: The number of entries in the path, 0 for the column itself.
      identifier:
        type: value
        description: The identifier, an INTEGER or VARCHAR value. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_get_bind_info_set_option:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-06" ]
    description: |
      Sets an option describing the bound call: a key-value fact about what the call reads, e.g. a property of the
      file it reads. Setting a key again replaces its value.

      A multi-file function registered with `[[connection_register_multi_file_function]]` or
      `[[extension_register_multi_file_function]]` exposes the options of the function it wraps as the metadata of the
      reader of each file, e.g. to a custom multi-file reader of another extension.
    parameters:
      info:
        type: table_function_get_bind_info_info
        description: The get bind info handle.
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The key of the option. Borrowed and copied.
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` need not be null-terminated and may be NULL only when this is 0.
      value:
        type: value
        description: The value of the option. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # To String Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  table_function_set_to_string_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the optional "to string" callback of the table function.

      The engine invokes the callback with the bind data of a bound call when it renders a query plan that scans the
      function, e.g. for `EXPLAIN`, `EXPLAIN ANALYZE` and the profiler, both for the logical and for the physical
      plan. The callback reports what the plan shows for the scan as key-value pairs with
      `[[table_function_to_string_set]]`, e.g. the file or the remote table it reads. Without the callback the physical plan shows the name of the function under
      the key `Function`; with it, the plan shows what the callback reports instead, so a callback that wants the name
      shown reports it itself. The engine shows the projections, filters and estimated cardinality of the scan next to
      them either way. The callback may be invoked more than once for the same bind data, and is not invoked with the
      global state of a scan, so it should only report what the bind already determined. A function wrapped in a
      multi-file function is not asked: the plan describes the multi-file scan.

      With profiling enabled (including `EXPLAIN ANALYZE`), the engine also invokes the callback while the query
      executes, once per worker thread that scans the function. Calls can therefore run concurrently with the same
      bind data and user data, so the callback must not modify them without synchronization, and an error it reports
      there fails the query. Builds with assertions enabled also invoke it while executing queries without profiling.
    parameters:
      function:
        type: table_function
        description: The function to set the callback of.
      callback:
        type: table_function_to_string_callback
        description: The "to string" callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_to_string_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Retrieves the user data set via `[[table_function_set_user_data]]`.
    parameters:
      info:
        type: table_function_to_string_info
        description: The to string info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_to_string_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Retrieves the bind data the function's bind callback set for the bound call being described.
    parameters:
      info:
        type: table_function_to_string_info
        description: The to string info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_to_string_set:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Reports a key-value pair the query plan shows for the scan, e.g. `File` and the path of the file it reads. The
      plan shows the pairs in the order they were first reported; setting a key again replaces its value in place.
      Fails with `ERROR_INPUT_INVALID` when the key is empty.
    parameters:
      info:
        type: table_function_to_string_info
        description: The to string info handle.
      key:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The key. Borrowed and copied.
      key_length:
        type: idx
        description: The length of `key` in bytes. `key` need not be null-terminated.
      value:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The value. Borrowed and copied. May span several lines.
      value_length:
        type: idx
        description: The length of `value` in bytes. `value` need not be null-terminated and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Operator
  #---------------------------------------------------------------------------------------------------------------------
  table_function_set_operator:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Makes the table function a table in-out function, whose rows the given operator produces from an input.

      Instead of producing its rows from nothing by scanning a data source, the function then transforms an input into
      its rows: the operator's execute callback receives the input chunk by chunk, and writes the function's rows
      into its output chunk, which holds the columns declared by the bind callback. Where the input comes from is set
      by `input`, see `[[TABLE_OPERATOR_INPUT]]`. The bind callback still runs first, declares the result columns,
      and can inspect the input columns with `[[table_function_bind_get_input_column_count]]` and its siblings; the
      operator reaches the bind data via e.g. `[[operator_execute_get_bind_data]]`.

      The operator's configuration is copied, so the caller still owns `op` and must destroy it with
      `[[operator_destroy]]`; it may be handed to several functions. Calling this again replaces the operator.

      Registration rejects a function with an operator that also has a data source, or a callback that is part of
      scanning: init global, init local, progress, metrics, filter pushdown, partition data, partitioning and claim
      batch callbacks, and the `file_row_number` virtual column. The operator itself carries the init, finalize and
      progress callbacks. Projection pushdown (see `[[table_function_set_projection_pushdown]]`) and the virtual columns a bind
      callback declares (see `[[table_function_bind_add_virtual_column]]`) apply to the operator's output chunk as
      they do to a data source's: the operator looks up which column each of its vectors stands for with e.g.
      `[[operator_execute_get_column_index]]`. For `TABLE_OPERATOR_INPUT_TABLE`, the signature must not declare positional parameters, since the
      table is the only positional argument; registration adds it. It may declare named parameters, which are
      constant arguments of the call as usual. Such a function cannot be overloaded, and its operator cannot have a
      finalize callback when it is called with a table that is correlated with an outer query. For
      `TABLE_OPERATOR_INPUT_ARGUMENTS`, the operator cannot have a finalize callback.
    parameters:
      function:
        type: table_function
        description: The function to set the operator of.
      op:
        type: operator
        description: The operator producing the function's rows. Borrowed; its configuration is copied.
      input:
        type: TABLE_OPERATOR_INPUT
        description: Where the operator's input comes from.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Combine Schema Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  table_function_set_combine_schema_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the optional "combine schema" callback of the table function.

      A multi-file function registered with `[[connection_register_multi_file_function]]` or
      `[[extension_register_multi_file_function]]` binds the function it wraps for each of the first files of a scan
      (see `[[multi_file_function_set_maximum_sample_files]]`) and combines the columns they bound to by name, taking
      the highest type of every column. It invokes the callback with the bind data of those files when it needs more
      than that - e.g. to determine the schema of the scan as if all sampled files had been one - and the callback can
      declare the combined columns and the bind data every file of the scan is bound with from then on. Without a
      callback the columns of the files are combined by name only, and every file is bound on its own.
    parameters:
      function:
        type: table_function
        description: The function to set the callback of.
      callback:
        type: table_function_combine_schema_callback
        description: The "combine schema" callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_combine_schema_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: Retrieves the user data set via `[[table_function_set_user_data]]`.
    parameters:
      info:
        type: table_function_combine_schema_info
        description: The combine schema info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_combine_schema_get_file_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Returns the number of files whose schemas are combined.

      Valid indices for `[[table_function_combine_schema_get_bind_data]]` are [0, count). The files are in the order
      of the scan.
    parameters:
      info:
        type: table_function_combine_schema_info
        description: The combine schema info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of files.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_combine_schema_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the bind data the function's bind callback set when it bound the file at the given index.

      Fails if the index is out of bounds. The data is borrowed and valid only for the duration of the callback.
    parameters:
      info:
        type: table_function_combine_schema_info
        description: The combine schema info handle.
      index:
        type: idx
        description: The index of the file.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if the bind callback set none.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_combine_schema_get_union_by_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Reports whether the schemas are combined because the scan unifies the columns of its files by name
      (`union_by_name`): the files are then expected to have different columns. Otherwise the files are expected to
      have the same columns, and their schemas are combined to determine the schema of the scan more accurately.
    parameters:
      info:
        type: table_function_combine_schema_info
        description: The combine schema info handle.
      union_by_name:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the columns are unified by name.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_combine_schema_get_combined_column_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Returns the number of columns the schemas of the files combine to by name, which the callback keeps unless it
      declares columns of its own with `[[table_function_combine_schema_add_result_column]]`.

      Valid indices for `[[table_function_combine_schema_get_combined_column_type]]` and
      `[[table_function_combine_schema_get_combined_column_name]]` are [0, count).
    parameters:
      info:
        type: table_function_combine_schema_info
        description: The combine schema info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of combined columns.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_combine_schema_get_combined_column_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the type of the combined column at the given index.

      Fails if the index is out of bounds. The returned type is owned by the caller and must be destroyed via
      `[[logical_type_destroy]]`.
    parameters:
      info:
        type: table_function_combine_schema_info
        description: The combine schema info handle.
      index:
        type: idx
        description: The index of the combined column to get the type of.
      type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the column type. Owned by the caller; destroy via `[[logical_type_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_combine_schema_get_combined_column_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Retrieves the name of the combined column at the given index.

      Fails if the index is out of bounds. The name is borrowed and valid only for the duration of the callback.
    parameters:
      info:
        type: table_function_combine_schema_info
        description: The combine schema info handle.
      index:
        type: idx
        description: The index of the combined column to get the name of.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the column name. Valid only for the duration of the callback.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_combine_schema_add_result_column:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Declares one of the columns the files combine to, replacing the columns combined by name.

      Call this once per column, in order. The first call discards the columns combined by name: a callback that
      declares none keeps them. The type must be a fully defined concrete type; ANY is rejected. The name and type
      are borrowed and copied.
    parameters:
      info:
        type: table_function_combine_schema_info
        description: The combine schema info handle.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the column. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` must be valid UTF-8, need not be null-terminated, and may be NULL only when this is 0.
      type:
        type: logical_type
        description: The type of the column. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_combine_schema_set_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the bind data describing the combined schema.

      The multi-file function binds every file of the scan with it: the bind callback finds the combined columns as its
      expected schema (see `[[table_function_bind_get_expected_column_count]]`) and this data as the expected bind data
      (see `[[table_function_bind_get_expected_bind_data]]`), and reads its file accordingly instead of determining a
      schema of its own. The files that were bound to combine their schemas are bound again. Without bind data, every
      file is bound on its own and its columns are reconciled with the combined schema by name. The opaque handle
      bundles the pointer with an optional destructor and an optional equality callback, as for
      `[[function_bind_set_bind_data]]`.
    parameters:
      info:
        type: table_function_combine_schema_info
        description: The combine schema info handle.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the bind data pointer plus optional destructor and equality callbacks.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Multi-file functions
  #---------------------------------------------------------------------------------------------------------------------
  multi_file_function_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Creates a new multi-file function through a factory.

      The function starts out empty: give it a name with `[[multi_file_function_set_name]]` and the single-file function
      it wraps with `[[multi_file_function_set_single_file_function]]`, then make it available with
      `[[connection_register_multi_file_function]]` or `[[extension_register_multi_file_function]]`. The caller owns the
      returned handle and must destroy it with `[[multi_file_function_destroy]]`, also after registration.

      The multi-file function can only be registered on the database the factory belongs to.
    role: constructor
    belongs_to: multi_file_function
    parameters:
      factory:
        type: factory
        description: The factory to create the multi-file function through.
      function:
        type: multi_file_function
        indirection: 1
        kind: OUT
        description: On success, receives the newly created multi-file function. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Sets the name of the multi-file function, as SQL will call it.

      The name is borrowed and copied. Calling this again replaces the previous name. A name must be set before
      registration.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the name of.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name to set. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` need not be null-terminated and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_single_file_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Sets the name of the table function that reads a single file, which the multi-file function wraps.

      The single-file function must be registered before the multi-file function is, and must take the file to read as
      its only positional parameter, of type ANY. It is bound once for every file that is read, and receives the file
      the way a multi-file function takes one: as the VARCHAR path of the file when there is nothing more to know about
      it, and otherwise as a STRUCT holding the path in its `filename` field and the options to open the file with in
      its other fields - e.g. the size of the file, as a file system reported it while globbing, or the options a caller
      passed along with the file (`read_x([{'filename': 'f.x', 'file_size': 42}])`). Opening the file with those
      options, set with `[[file_open_options_set_value]]`, lets the file system skip work it would otherwise repeat,
      such as asking a remote store for the size of the file. A single-file function that takes a VARCHAR parameter
      instead is still accepted, and only receives the path. Every named parameter the single-file function declares is
      also a named parameter of the multi-file function, forwarded to it as given. Everything that involves several
      files - globbing, lists of files, hive partitioning, the `filename` column, `union_by_name` and the like - is
      provided by the multi-file function on top of it. The name is borrowed and copied. A single-file function must be
      set before registration.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the single-file function of.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the registered single-file table function. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` need not be null-terminated and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_single_file_table_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Sets the table function that reads a single file, which the multi-file function wraps, without registering it.

      Like `[[multi_file_function_set_single_file_function]]`, but the function is handed over directly instead of
      being looked up by name at registration, so it does not have to be registered on its own: it is then not
      callable from SQL, and does not show up in `duckdb_functions()`. The function's configuration is copied, so the
      caller still owns `table_function` and must destroy it. Replaces a single-file function set by name, and the
      other way around.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the single-file function of.
      table_function:
        type: table_function
        description: The table function that reads a single file. Borrowed; its configuration is copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_reader_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Sets how the files the function reads are referred to in messages, e.g. "Avro" or "JSON".

      Optional: without it, the files are referred to by the name of the multi-file function. The name is borrowed
      and copied.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the reader type of.
      reader_type:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The reader type. Borrowed and copied.
      reader_type_length:
        type: idx
        description: The length of `reader_type` in bytes. `reader_type` need not be null-terminated and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_file_extension:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Sets the file extension of the files the function reads, e.g. "avro".

      Optional. With a file extension, a path that names a directory rather than a file reads the files with that
      extension inside it. Without one, the paths passed to the function must match at least one file. The
      extension is given without a leading dot, and is borrowed and copied.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the file extension of.
      extension:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The file extension, without a leading dot. Borrowed and copied.
      extension_length:
        type: idx
        description: The length of `extension` in bytes. `extension` need not be null-terminated and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_maximum_sample_files:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets how many files the function samples by default to determine the schema of a scan.

      Optional: without it only the first file is sampled. The single-file function is bound for each of the sampled
      files and, when it has a combine schema callback (see `[[table_function_set_combine_schema_callback]]`), the
      schemas of the files are combined with it. The maximum `idx_t` samples all files; the count must be at least 1.
      A named parameter of the single-file function can override it per call, see
      `[[multi_file_function_set_sample_files_parameter]]`.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the number of sampled files of.
      count:
        type: idx
        description: The number of files to sample.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_sample_files_parameter:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-10" ]
    description: |
      Sets the name of the named parameter of the single-file function that sets how many files are sampled to
      determine the schema of a scan.

      Optional. A call that passes the parameter samples that many files instead of the default (see
      `[[multi_file_function_set_maximum_sample_files]]`); a value that is not usable as a count is left to the
      single-file function to report when it binds. The parameter is still forwarded to the single-file function as
      given. The name is borrowed and copied.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the sample files parameter of.
      name:
        type: char
        indirection: 1
        const: true
        kind: IN
        description: The name of the named parameter. Borrowed and copied.
      name_length:
        type: idx
        description: The length of `name` in bytes. `name` need not be null-terminated and may be NULL only when this is 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  connection_register_multi_file_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Registers the multi-file function, making it available for use in SQL queries.

      The function is registered on the connection's database, visible to every connection, in the connection's
      transaction: inside an explicit transaction, it is invisible to other connections until the transaction commits,
      and a rollback undoes it. It can then be called with the path of a single file, a glob pattern, or a list of
      either, and accepts the options every multi-file function accepts (e.g. `filename`, `hive_partitioning`,
      `union_by_name`) next to the named parameters of the single-file function. Registration requires a name and a
      single-file function, and fails when no table function by that name is registered or it does not take the path of
      the file to read as its only positional parameter (see `[[multi_file_function_set_single_file_function]]`). The
      multi-file function must have been created through a factory of the same database. The caller still owns the
      handle after registration and must destroy it with `[[multi_file_function_destroy]]`, which does not affect the
      registered function.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to register on.
      function:
        type: multi_file_function
        description: The multi-file function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  extension_register_multi_file_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Registers the multi-file function, making it available for use in SQL queries.

      The function is registered on the loading extension's database and attributed to the extension. Use this from the
      extension's load callback. It can then be called with the path of a single file, a glob pattern, or a list of
      either, and accepts the options every multi-file function accepts (e.g. `filename`, `hive_partitioning`,
      `union_by_name`) next to the named parameters of the single-file function. Registration requires a name and a
      single-file function, and fails when no table function by that name is registered or it does not take the path of
      the file to read as its only positional parameter (see `[[multi_file_function_set_single_file_function]]`). The
      multi-file function must have been created through a factory of the same database. The caller still owns the
      handle after registration and must destroy it with `[[multi_file_function_destroy]]`, which does not affect the
      registered function.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: The loading extension.
      function:
        type: multi_file_function
        description: The multi-file function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  multi_file_function_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Destroys the multi-file function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Destroying the handle after registration does not affect the registered function.
    parameters:
      function:
        type: multi_file_function
        description: The function to destroy.
        indirection: 1
    return_type: ERROR
