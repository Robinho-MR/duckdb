    return_type: ERROR

  table_function_partitioning_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-15" ]
    description: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: table_function_partitioning_info
        description: The partitioning info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_partitioning_get_partition_column_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-15" ]
    description: |
      Returns the number of columns the optimizer is asking about: the candidate `GROUP BY` column set.

      Valid indices for `[[table_function_partitioning_get_partition_column_index]]` are `0` up to (but
      excluding) this count.
    parameters:
      info:
        type: table_function_partitioning_info
        description: The partitioning info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of columns in the candidate set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_partitioning_get_partition_column_index:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-15" ]
    description: |
      Returns which declared column the candidate `GROUP BY` column at the given index stands for.

      The result indexes the columns declared with `[[table_function_bind_add_result_column]]`, in declaration
      order. Fails if the index is out of bounds.
    parameters:
      info:
        type: table_function_partitioning_info
        description: The partitioning info handle.
      index:
        type: idx
        description: The index of the candidate column.
      column_index:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the index of the declared column.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_partitioning_set_partition_info:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-15" ]
    description: |
      Reports whether every partition the scan produces carries exactly one distinct value for the candidate
      `GROUP BY` column set.

      Only `TABLE_PARTITION_INFO_SINGLE_VALUE_PARTITIONS` unlocks the partitioned aggregate optimization; any
      other value keeps the regular hash aggregate. A callback that never calls this is treated as reporting
      `TABLE_PARTITION_INFO_NOT_PARTITIONED`. Fails with `ERROR_INPUT_INVALID` when partition_info is not one of the
      enum's declared values.
    parameters:
      info:
        type: table_function_partitioning_info
        description: The partitioning info handle.
      partition_info:
        type: TABLE_PARTITION_INFO
        description: Whether, and how, the scan is partitioned by the candidate column set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_bind_get_input_column_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Returns the number of columns of the input of the function's operator (see `[[table_function_set_operator]]`).

      These are the vectors of the input chunks the operator's execute callback receives: the positional arguments of
      the call for `TABLE_OPERATOR_INPUT_ARGUMENTS`, or the columns of the table argument for
      `TABLE_OPERATOR_INPUT_TABLE`. A bind callback typically derives the function's result columns from them. Unlike
      `[[function_bind_get_arg_value]]`, this also describes arguments that are not constant. 0 for a function without
      an operator.
    parameters:
      info:
        type: table_function_bind_info
        description: The bind info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of input columns.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_bind_get_input_column_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Retrieves the type of the operator's input column at the given index (see
      `[[table_function_bind_get_input_column_count]]`).

      Fails if the index is out of bounds. The returned type is owned by the caller and must be destroyed via
      `[[logical_type_destroy]]`.
    parameters:
      info:
        type: table_function_bind_info
        description: The bind info handle.
      index:
        type: idx
        description: The index of the input column.
      type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the column type. Owned by the caller; destroy via `[[logical_type_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_bind_get_input_column_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-25" ]
    description: |
      Retrieves the name of the operator's input column at the given index (see
      `[[table_function_bind_get_input_column_count]]`).

      For `TABLE_OPERATOR_INPUT_TABLE` this is the name of the column of the table argument. The arguments of
      `TABLE_OPERATOR_INPUT_ARGUMENTS` have no names, and yield an empty name. Fails if the index is out of bounds.
      The name is borrowed and valid only for the duration of the callback.
    parameters:
      info:
        type: table_function_bind_info
        description: The bind info handle.
      index:
        type: idx
        description: The index of the input column.
      name:
        type: char
        indirection: 2
        const: true
        kind: OUT_BORROW
        description: Receives a borrowed pointer to the column name. Valid only for the duration of the callback.
      name_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the length of `*name` in bytes. `*name` is not guaranteed to be null-terminated.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

