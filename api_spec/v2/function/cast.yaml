module: cast
#
# Cast functions convert values of one logical type into another. A cast is
# registered for a (source type, target type) pair rather than by name, and is
# reached from SQL through CAST / TRY_CAST -- and, when it declares an implicit
# cast cost, through the binder resolving argument types on its own.
#
# The single exec callback is handed an input vector, an output vector and a
# row count, and converts a whole batch at a time. Whether a per-row conversion
# failure aborts the query or turns into a NULL is decided by the cast mode,
# which the callback reads with `[[cast_function_exec_get_mode]]`.
#
# Casts are typically registered alongside a custom type: see
# `[[custom_type_register]]` for how a name is bound to a base type.

#-----------------------------------------------------------------------------------------------------------------------
# Enums
#-----------------------------------------------------------------------------------------------------------------------
enums:
  CAST_MODE:
    description: |
      The mode a cast is being executed in. A normal cast must either succeed
      for every row or report an error, which aborts the query. A "try" cast
      (SQL TRY_CAST, and implicit casts the engine probes speculatively)
      tolerates per-row failures: the callback writes NULL for the rows it
      could not convert instead of aborting. Read with
      `[[cast_function_exec_get_mode]]`, and passed to `[[vector_cast]]`.
    values:
      CAST_MODE_NORMAL:
        value: 0
        description: A regular cast. A conversion failure reported through the error slot aborts the query.
      CAST_MODE_TRY:
        value: 1
        description: A "try" cast. Conversion failures should be written as NULLs into the output vector; an error reported through the slot is swallowed and the affected rows are left NULL.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  cast_function:
    description: |
      An owned opaque handle to a cast function being built. Created with `[[cast_function_create]]`, configured with the setter functions (e.g.
      `[[cast_function_set_source_type]]`, `[[cast_function_set_exec_callback]]`, etc.), made available with
      `[[connection_register_cast_function]]` or `[[extension_register_cast_function]]`, and destroyed with `[[cast_function_destroy]]`.

  cast_function_exec_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a cast function during the execution "exec" phase.
      The "exec" callback receives this handle and can use it to access the input vector, the output vector to
      write into, the number of rows to convert, and the mode the cast is running in.

  cast_function_bind_info:
    description: |
      A borrowed opaque handle to the cast being bound, given to the "bind" callback. It gives access to the user
      data and the source and target type of the cast, and is used to set the bind data of the bound cast.

  cast_function_init_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a cast function during the local state initialization
      "init" phase. The "init" callback receives this handle once per execution thread, and uses it to set "init
      data" for that thread, retrievable from the exec callbacks of the thread.

#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  cast_function_exec_callback:
    parameters:
      info:
        type: cast_function_exec_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  cast_function_bind_callback:
    parameters:
      info:
        type: cast_function_bind_info
        description: Borrowed opaque handle providing access to the cast being bound.
      context:
        type: context
        description: |
          Borrowed handle to the context of the query binding the cast. Null when the engine binds the cast without a
          client context, for example to cast a constant while it loads a database.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback. An error aborts the binding with that error.
    return_type: void

  cast_function_init_callback:
    parameters:
      info:
        type: cast_function_init_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query the cast runs in.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Constructors
  #---------------------------------------------------------------------------------------------------------------------
  cast_function_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Creates a new cast function through a factory.

      The function starts out empty: configure it with the setter functions (e.g. `[[cast_function_set_source_type]]`,
      `[[cast_function_set_exec_callback]]`, etc.), then make it available with `[[connection_register_cast_function]]` or `[[extension_register_cast_function]]`. The caller owns the returned handle and must destroy it with
      `[[cast_function_destroy]]`, also after registration.

      The cast function can only be registered on the database the factory belongs to.
    role: constructor
    belongs_to: cast_function
    parameters:
      factory:
        type: factory
        description: The factory to create the cast function through.
      function:
        type: cast_function
        indirection: 1
        kind: OUT
        description: On success, receives the newly created cast function. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Properties
  #---------------------------------------------------------------------------------------------------------------------
  cast_function_set_source_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Sets the type the cast converts from.

      The type is borrowed and copied. Calling this again replaces the previous source type. A source type must
      be set before registration, and it must be a fully defined concrete type.
    parameters:
      function:
        type: cast_function
        description: The function to set the source type of.
      source_type:
        type: logical_type
        description: The type to cast from. Borrowed for the call only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_set_target_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Sets the type the cast converts to.

      The type is borrowed and copied. Calling this again replaces the previous target type. A target type must
      be set before registration, and it must be a fully defined concrete type.
    parameters:
      function:
        type: cast_function
        description: The function to set the target type of.
      target_type:
        type: logical_type
        description: The type to cast to. Borrowed for the call only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_set_implicit_cast_cost:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Sets what it costs to apply this cast implicitly.

      The binder uses the cost to choose between candidate implicit casts: a lower non-negative cost makes the
      cast more likely to be picked, a higher one less likely. Built-in widening casts sit in the [0, 20] range,
      so a cost above 100 effectively puts this cast last. A negative cost -- the default -- means the cast is
      never applied implicitly and is reached only through an explicit CAST or TRY_CAST.
    parameters:
      function:
        type: cast_function
        description: The function to set the implicit cast cost of.
      cost:
        type: i64
        description: The cost. Negative disables implicit casting.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_get_implicit_cast_cost:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Retrieves the cost the binder assigns to converting `source_type` to `target_type` on its own, or -1 when it
      does not convert them implicitly.

      A cast that implements a conversion the engine already knows, e.g. one that applies a time zone, passes this to
      `[[cast_function_set_implicit_cast_cost]]` to keep the binder's choices between implicit casts as they are. The
      rules of the engine are not part of the API: they change between versions, which is why they are read rather than
      copied. The cost includes the casts registered on the factory's database so far.
    parameters:
      factory:
        type: factory
        description: The factory of the database to read the cost from.
      source_type:
        type: logical_type
        description: The type to cast from. Borrowed for the call only.
      target_type:
        type: logical_type
        description: The type to cast to. Borrowed for the call only.
      cost:
        type: i64
        indirection: 1
        kind: OUT
        description: Receives the cost, or -1.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Sets arbitrary user data on the cast function.

      Associates an opaque pointer with the function, retrievable from the exec callback via
      `[[cast_function_exec_get_user_data]]`. The opaque handle bundles the pointer with an optional destructor,
      invoked when the data is no longer needed. The data is read-only during execution: the same pointer is
      shared by every thread running the cast.
    parameters:
      function:
        type: cast_function
        description: The function to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_set_property:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Sets a property of the cast function.

      Only `FUNCTION_PROPERTY_STABILITY` can be set. A cast whose result depends on a setting, such as the time zone,
      declares `FUNCTION_PROPERTY_STABILITY_CONSISTENT_WITHIN_QUERY`, so that the engine does not fold it into a constant
      of a prepared statement or accept it in an index expression. A cast cannot be
      `FUNCTION_PROPERTY_STABILITY_VOLATILE`. Any other key, or a value that does not belong to the key, results in an
      error. Defaults to `FUNCTION_PROPERTY_STABILITY_CONSISTENT`.
    parameters:
      function:
        type: cast_function
        description: The function to set the property of.
      key:
        type: FUNCTION_PROPERTY_KEY
        description: The property to set. Must be `FUNCTION_PROPERTY_STABILITY`.
      value:
        type: FUNCTION_PROPERTY_VALUE
        description: The value to set for the property. Must belong to `key`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_set_bind_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Sets the optional bind callback of the cast function.

      The bind callback is called every time the cast is bound for a query, before it runs. It can read the source and
      target type, set "bind data" the init and exec callbacks read, and refuse the cast by reporting an error, which
      then is the error of the statement being bound. It may be called without a context, see
      `[[cast_function_bind_callback]]`.
    parameters:
      function:
        type: cast_function
        description: The function to set the bind callback of.
      callback:
        type: cast_function_bind_callback
        description: The bind callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_set_init_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Sets the optional init callback of the cast function.

      The init callback is called once per execution thread before the thread first runs the exec callback. It sets
      "init data" for the thread, e.g. a cache the exec callback fills, which the exec callback reads with
      `[[cast_function_exec_get_init_data]]`.
    parameters:
      function:
        type: cast_function
        description: The function to set the init callback of.
      callback:
        type: cast_function_init_callback
        description: The init callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_set_exec_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Sets the exec callback of the cast function.

      The exec callback implements the conversion: it is invoked during query execution with a batch of input
      values and must fill the output vector. An exec callback must be set before registration.
    parameters:
      function:
        type: cast_function
        description: The function to set the exec callback of.
      callback:
        type: cast_function_exec_callback
        description: The exec callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Bind Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  cast_function_bind_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Retrieves the user data set via `[[cast_function_set_user_data]]`.
    parameters:
      info:
        type: cast_function_bind_info
        description: The bind info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_bind_get_source_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Retrieves the type the cast is bound to convert from.

      The returned type is owned by the caller and must be destroyed via `[[logical_type_destroy]]`.
    parameters:
      info:
        type: cast_function_bind_info
        description: The bind info handle.
      type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the source type. Owned by the caller; destroy via `[[logical_type_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_bind_get_target_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Retrieves the type the cast is bound to convert to.

      The returned type is owned by the caller and must be destroyed via `[[logical_type_destroy]]`.
    parameters:
      info:
        type: cast_function_bind_info
        description: The bind info handle.
      type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the target type. Owned by the caller; destroy via `[[logical_type_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_bind_set_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Sets the "bind data" of the bound cast from the bind callback.

      The bind data is stored with the bound cast and read by the init and exec callbacks. The opaque handle bundles the
      pointer with an optional destructor, called when the bound cast is destroyed, and an optional equality callback;
      without one, pointer equality is used. Calling this again replaces the bind data.
    parameters:
      info:
        type: cast_function_bind_info
        description: The bind info handle.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the bind data pointer plus optional destructor and equality callbacks.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Init Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  cast_function_init_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Retrieves the user data set via `[[cast_function_set_user_data]]`.
    parameters:
      info:
        type: cast_function_init_info
        description: The init info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_init_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Retrieves the bind data set by the bind callback.
    parameters:
      info:
        type: cast_function_init_info
        description: The init info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_init_set_init_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Sets the "init data" of the execution thread from the init callback.

      The init data is read by the exec callbacks of the thread with `[[cast_function_exec_get_init_data]]`. The opaque
      handle bundles the pointer with an optional destructor, called when the thread is done with the cast.
    parameters:
      info:
        type: cast_function_init_info
        description: The init info handle.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the init data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Exec Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  cast_function_exec_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: Retrieves the user data set via `[[cast_function_set_user_data]]`.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_exec_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Retrieves the bind data set by the bind callback.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_exec_get_init_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-27" ]
    description: |
      Retrieves the init data set by the init callback of the thread running the cast.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the init data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_exec_get_row_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Returns how many rows this execution must convert.

      The number of rows held by the input vector, and the number of entries the callback must write to the
      output vector. Note that this may be less than a full vector: a constant input is converted as a single
      row and the result is expanded by the engine.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of rows.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_exec_get_input:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Retrieves the input vector holding the values to convert.

      The vector holds the source type's values for the current batch; use `[[cast_function_exec_get_row_count]]`
      for the number of rows. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      vector:
        type: vector
        indirection: 1
        kind: OUT
        description: Receives the borrowed input vector.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_exec_get_output:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Retrieves the output vector the exec callback must write into.

      The callback must write one entry per input row; use `[[cast_function_exec_get_row_count]]` for the number
      of rows. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      vector:
        type: vector
        indirection: 1
        kind: OUT
        description: Receives the borrowed output vector to write into.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  cast_function_exec_get_mode:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Returns the mode the cast is being executed in.

      In `CAST_MODE_TRY` a conversion failure should be written as a NULL into the output vector rather than
      reported through the error slot, since the engine discards the error and keeps whatever the callback left
      in the output.
    parameters:
      info:
        type: cast_function_exec_info
        description: The exec info handle.
      mode:
        type: CAST_MODE
        indirection: 1
        kind: OUT
        description: Receives the cast mode.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Register
  #---------------------------------------------------------------------------------------------------------------------
  connection_register_cast_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Registers the cast function, making it available to CAST and TRY_CAST.

      The cast is registered on the connection's database and takes effect immediately for every connection; it is not
      part of the connection's transaction, so a rollback does not undo it. Registration requires a source type, a
      target type and an exec callback; both types must be fully defined concrete types. Registering a cast for a pair
      that already has one replaces it. The cast function must have been created through a factory of the same database.
      The caller still owns the handle after registration and must destroy it with `[[cast_function_destroy]]`, which
      does not affect the registered function.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to register on.
      function:
        type: cast_function
        description: The cast function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  extension_register_cast_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Registers the cast function, making it available to CAST and TRY_CAST.

      The cast is registered on the loading extension's database. Use this from the extension's load callback.
      Registration requires a source type, a target type and an exec callback; both types must be fully defined concrete
      types. Registering a cast for a pair that already has one replaces it. The cast function must have been created
      through a factory of the same database. The caller still owns the handle after registration and must destroy it
      with `[[cast_function_destroy]]`, which does not affect the registered function.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: The loading extension.
      function:
        type: cast_function
        description: The cast function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Destroy
  #---------------------------------------------------------------------------------------------------------------------
  cast_function_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-02" ]
    description: |
      Destroys the cast function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to
      prevent double-destruction. Destroying the handle after registration does not affect the registered
      function.
    parameters:
      function:
        type: cast_function
        description: The function to destroy.
        indirection: 1
    return_type: ERROR
