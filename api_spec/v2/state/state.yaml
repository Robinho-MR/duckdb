module: state
#
# State an extension keeps next to DuckDB's own: per connection, and per instance.
#
# Connection state is an object of the extension's, registered on a client context under a key. It lives as long as
# the connection does, is told when queries and transactions begin and end, can add to the query profile, and is
# destroyed with the connection. It is the counterpart of DuckDB's `ClientContextState`.
#
# The object cache is a per-instance map of objects, shared by all connections. Entries are either pinned for as long
# as the instance lives, or evictable: they are accounted against the memory limit and dropped, least recently used
# first, when it is needed. It is the counterpart of DuckDB's `ObjectCache`.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  context_state:
    description: |
      A borrowed opaque handle to connection state being set up, received by the init callback of
      `[[context_get_or_create_state]]` or `[[connection_get_or_create_state]]` and valid only for the duration of
      that call. Configure it with `[[context_state_set_user_data]]` and the callback setters; whatever is not set
      stays inert.

  context_state_profile:
    description: |
      A borrowed opaque handle to the profile of the query that just ended, received by a connection state's profiling
      callback and valid only for the duration of that call. Add text to it with `[[context_state_profile_write]]`.

  object_cache:
    description: |
      A borrowed opaque handle to the object cache of an instance. Obtained from `[[instance_get_object_cache]]` or
      `[[context_get_object_cache]]`, valid for as long as the instance is, and never destroyed by the caller.

  object_cache_entry:
    description: |
      An owned opaque handle to an entry of an object cache. Obtained from `[[object_cache_get]]` or
      `[[object_cache_get_or_create]]`, and destroyed with `[[object_cache_entry_destroy]]`. Holding the handle keeps
      the entry's data alive: the cache may evict or delete the entry meanwhile, but the data is only destroyed once
      the last handle is.

#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  context_state_init_callback:
    description: |
      Sets up the connection state of a key that has none yet.

      Runs at most once per key and connection, while the connection's registered states are locked: it must not
      create, get or remove connection state itself. A failure reported through `err` leaves the key unregistered
      and fails the call that triggered the init.
    parameters:
      context:
        type: context
        description: Borrowed handle to the context the state is created for.
      user_data:
        type: void
        indirection: 1
        description: The pointer handed to `[[context_get_or_create_state]]`, passed through untouched.
      state:
        type: context_state
        description: Borrowed handle to the state to configure.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure to set the state up through.
    return_type: void

  context_state_query_begin_callback:
    description: |
      Called when a query starts on the connection, before any of it runs. Called at most once per query, also for
      the queries DuckDB runs on behalf of another. No transaction is guaranteed to be active.

      An error reported through `err` fails the query.
    parameters:
      context:
        type: context
        description: Borrowed handle to the context of the query.
      user_data:
        type: void
        indirection: 1
        description: The data set via `[[context_state_set_user_data]]`.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through.
    return_type: void

  context_state_query_end_callback:
    description: |
      Called when a query ends on the connection, whether it succeeded, failed or was cancelled. The place to drop
      what was only meant to last for one query. No transaction is guaranteed to be active.

      The callback cannot fail: there is nothing left to fail.
    parameters:
      context:
        type: context
        description: Borrowed handle to the context of the query.
      user_data:
        type: void
        indirection: 1
        description: The data set via `[[context_state_set_user_data]]`.
      error:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The message of the error that ended the query, or null if it succeeded. Borrowed for the duration of the call.
    return_type: void

  context_state_transaction_begin_callback:
    description: |
      Called when a transaction starts on the connection, explicitly or automatically. The transaction is active.

      An error reported through `err` fails the statement starting the transaction.
    parameters:
      context:
        type: context
        description: Borrowed handle to the context of the transaction.
      user_data:
        type: void
        indirection: 1
        description: The data set via `[[context_state_set_user_data]]`.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through.
    return_type: void

  context_state_transaction_end_callback:
    description: |
      Called when a transaction ends on the connection: after it committed, or after it was rolled back, either
      explicitly or because its statement failed. A transaction whose commit fails is reported as rolled back. No
      transaction is active any longer.

      The callback cannot fail: the transaction has already ended, and its fate does not depend on the callback.
    parameters:
      context:
        type: context
        description: Borrowed handle to the context of the transaction.
      user_data:
        type: void
        indirection: 1
        description: The data set via `[[context_state_set_user_data]]`.
    return_type: void

  context_state_profiling_callback:
    description: |
      Called when the text rendering of the profile of a query is written, as `EXPLAIN ANALYZE` does, to let the state
      add to it. What the state writes comes out next to what other connection states wrote.
    parameters:
      profile:
        type: context_state_profile
        description: Borrowed handle to the profile being written.
      user_data:
        type: void
        indirection: 1
        description: The data set via `[[context_state_set_user_data]]`.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through. A reported error is dropped.
    return_type: void

  object_cache_create_callback:
    description: |
      Creates the data of a cache entry that does not exist yet.

      Runs while the cache is locked, so that two threads never both create the same entry: it must not use the
      object cache itself. A failure reported through `err` leaves the entry uncreated and fails the call.
    parameters:
      user_data:
        type: void
        indirection: 1
        description: The pointer handed to `[[object_cache_get_or_create]]`, passed through untouched.
      data:
        type: opaque
        indirection: 1
        kind: OUT
        description: Receives the data, a pointer bundled with an optional destructor. Owned by the cache from here on.
      size_bytes:
        type: idx
        indirection: 1
        kind: OUT
        description: |
          Receives the approximate memory the data takes up, which the cache accounts against the memory limit. 0
          means the entry is pinned instead: never evicted, it lives until deleted or until the instance is destroyed.
          Left at 0 if the callback does not touch it.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to report a failure through.
    return_type: void

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Connection state
  #---------------------------------------------------------------------------------------------------------------------
  context_get_or_create_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Gets the state registered under a key on the connection of a context, creating it first if there is none.

      The init callback sets up a new state; it runs at most once per key and connection, also when several threads
      race to get the same key. The state lives until `[[context_remove_state]]` or until the connection is
      destroyed, and then releases its user data through the destructor bundled with it. The data pointer received is
      the state's user data, valid for as long as the state is.

      Keys are case-sensitive and shared by everything that registers state on the connection, DuckDB's extensions
      included: prefix them with the name of the extension. A key held by something that is not state of this API
      fails the call.
    parameters:
      context:
        type: context
        description: The context whose connection to take the state from.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the state. Borrowed and copied.
      init:
        type: context_state_init_callback
        description: Sets up the state if the key has none yet.
      init_user_data:
        type: void
        indirection: 1
        description: Handed to the init callback. Borrowed for the duration of the call.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data of the state, or null if it set none. Optional.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  connection_get_or_create_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Gets the state registered under a key on a connection, creating it first if there is none. The same as
      `[[context_get_or_create_state]]`, for a connection that is not seen from inside DuckDB.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to take the state from.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the state. Borrowed and copied.
      init:
        type: context_state_init_callback
        description: Sets up the state if the key has none yet.
      init_user_data:
        type: void
        indirection: 1
        description: Handed to the init callback. Borrowed for the duration of the call.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data of the state, or null if it set none. Optional.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_get_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Looks up the state registered under a key on the connection of a context, without creating it.

      `found` receives false if there is no state under the key, and `data` is then left untouched. The data pointer
      is valid until the state is removed or the connection is destroyed.
    parameters:
      context:
        type: context
        description: The context whose connection to look the state up on.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the state. Borrowed for the duration of the call.
      found:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the key has state.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data of the state, or null if it set none. Optional.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  connection_get_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Looks up the state registered under a key on a connection. The same as `[[context_get_state]]`.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to look the state up on.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the state. Borrowed for the duration of the call.
      found:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives whether the key has state.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data of the state, or null if it set none. Optional.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_remove_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Removes the state registered under a key on the connection of a context, destroying its user data. Removing a
      key that has no state is not an error.

      The callbacks of the state do not run for the query or transaction that is under way, and the data pointer
      handed out earlier is not valid any longer.
    parameters:
      context:
        type: context
        description: The context whose connection to remove the state from.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the state. Borrowed for the duration of the call.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  connection_remove_state:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Removes the state registered under a key on a connection. The same as `[[context_remove_state]]`.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to remove the state from.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the state. Borrowed for the duration of the call.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Configuring connection state
  #---------------------------------------------------------------------------------------------------------------------
  context_state_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Sets the user data of the state, handed to all of its callbacks.

      The opaque handle bundles the pointer with an optional destructor, invoked when the state is removed or its
      connection is destroyed. If the state could not be created after all, because its init callback reported an
      error, the destructor is invoked right away.
    parameters:
      state:
        type: context_state
        description: The state to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_state_set_query_begin_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Sets the callback called when a query starts on the connection.
    parameters:
      state:
        type: context_state
        description: The state to set the callback of.
      callback:
        type: context_state_query_begin_callback
        description: The callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_state_set_query_end_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Sets the callback called when a query ends on the connection.
    parameters:
      state:
        type: context_state
        description: The state to set the callback of.
      callback:
        type: context_state_query_end_callback
        description: The callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_state_set_transaction_begin_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Sets the callback called when a transaction starts on the connection.
    parameters:
      state:
        type: context_state
        description: The state to set the callback of.
      callback:
        type: context_state_transaction_begin_callback
        description: The callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_state_set_transaction_commit_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Sets the callback called when a transaction on the connection committed.
    parameters:
      state:
        type: context_state
        description: The state to set the callback of.
      callback:
        type: context_state_transaction_end_callback
        description: The callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_state_set_transaction_rollback_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Sets the callback called when a transaction on the connection was rolled back.
    parameters:
      state:
        type: context_state
        description: The state to set the callback of.
      callback:
        type: context_state_transaction_end_callback
        description: The callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_state_set_profiling_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Sets the callback called when the profile of a query is written, to let the state add to it.
    parameters:
      state:
        type: context_state
        description: The state to set the callback of.
      callback:
        type: context_state_profiling_callback
        description: The callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_state_profile_write:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: Adds text to the profile being written. The text is borrowed and copied.
    parameters:
      profile:
        type: context_state_profile
        description: The profile to add to.
      text:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The text to add.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Object cache
  #---------------------------------------------------------------------------------------------------------------------
  instance_get_object_cache:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the object cache of an instance.

      The returned handle is borrowed: it is valid only for as long as the instance is, and must not be destroyed.
    role: getter
    belongs_to: instance
    parameters:
      instance:
        type: instance
        description: The instance to take the object cache from.
      cache:
        type: object_cache
        indirection: 1
        kind: OUT
        description: Receives the borrowed object cache.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  context_get_object_cache:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Borrows the object cache of the instance a context belongs to.

      The returned handle is borrowed: it is valid only for as long as the instance is, and must not be destroyed.
    parameters:
      context:
        type: context
        description: The context to take the object cache from.
      cache:
        type: object_cache
        indirection: 1
        kind: OUT
        description: Receives the borrowed object cache.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  object_cache_put:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Puts an entry into the cache, replacing the entry of the same type and key, if any.

      Entries are looked up by type and key together, so a key only has to be unique within its type. Name types
      after the extension, e.g. `my_extension.footer`, as the cache is shared by everything on the instance.

      The opaque handle bundles the data with an optional destructor, invoked once the entry is gone from the cache
      and nobody holds it any longer. If the call fails, the destructor is invoked right away. A `size_bytes` of 0
      pins the entry for as long as it is not deleted or replaced, and the instance lives. Any other value makes it
      evictable: the cache counts it against the memory limit, and may drop it, least recently used first, when
      memory is needed.
    role: method
    belongs_to: object_cache
    parameters:
      cache:
        type: object_cache
        description: The cache to put the entry into.
      type:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The type of the entry. Borrowed and copied.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the entry. Borrowed and copied.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the data pointer plus an optional destructor.
      size_bytes:
        type: idx
        description: The approximate memory the data takes up, or 0 to pin the entry.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  object_cache_get:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Looks an entry up, marking it as recently used.

      `entry` receives null if the cache has no entry of the type under the key, because there never was one or it was
      evicted. Otherwise the caller owns it, and must destroy it via `[[object_cache_entry_destroy]]`.
    role: method
    belongs_to: object_cache
    parameters:
      cache:
        type: object_cache
        description: The cache to look the entry up in.
      type:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The type of the entry. Borrowed for the duration of the call.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the entry. Borrowed for the duration of the call.
      entry:
        type: object_cache_entry
        indirection: 1
        kind: OUT
        description: Receives the entry, or null if there is none. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  object_cache_get_or_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Looks an entry up, creating it first with the create callback if there is none.

      Creation is atomic: of several threads racing for the same entry, one runs the create callback and the others
      receive its result. The entry is returned as `[[object_cache_get]]` does, owned by the caller.
    role: method
    belongs_to: object_cache
    parameters:
      cache:
        type: object_cache
        description: The cache to look the entry up in.
      type:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The type of the entry. Borrowed for the duration of the call.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the entry. Borrowed for the duration of the call.
      create:
        type: object_cache_create_callback
        description: Creates the data of the entry if there is none yet.
      create_user_data:
        type: void
        indirection: 1
        description: Handed to the create callback. Borrowed for the duration of the call.
      entry:
        type: object_cache_entry
        indirection: 1
        kind: OUT
        description: Receives the entry. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  object_cache_delete:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Deletes an entry from the cache. Deleting an entry that is not there is not an error.

      Holders of the entry keep its data until they destroy their handle.
    role: method
    belongs_to: object_cache
    parameters:
      cache:
        type: object_cache
        description: The cache to delete the entry from.
      type:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The type of the entry. Borrowed for the duration of the call.
      key:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The key of the entry. Borrowed for the duration of the call.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  object_cache_entry_get_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Retrieves the data pointer of an entry, valid for as long as the entry handle is.
    role: getter
    belongs_to: object_cache_entry
    parameters:
      entry:
        type: object_cache_entry
        description: The entry to take the data of.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the data pointer.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  object_cache_entry_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-17" ]
    description: |
      Destroys the entry handle, releasing its hold on the data. Always succeeds. On success the handle is set to
      null. Safe to call on an already-null slot.
    role: destructor
    belongs_to: object_cache_entry
    parameters:
      entry:
        type: object_cache_entry
